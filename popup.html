<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <h2>SOCi URL Helper</h2>

    <div id="not-soci" class="hidden">
      <p class="muted">Not a SOCi page.</p>
      <p class="muted">Build a URL manually:</p>
    </div>

    <div class="field">
      <label for="tenant">Tenant</label>
      <input id="tenant" type="text" value="moz" placeholder="moz" spellcheck="false">
    </div>

    <div class="field">
      <label for="account">Account ID</label>
      <input id="account" type="text" placeholder="e.g. 3596" spellcheck="false">
    </div>

    <div class="field">
      <label for="project">Project ID</label>
      <input id="project" type="text" placeholder="optional" spellcheck="false">
    </div>

    <button id="go">Go</button>

    <div id="preview" class="preview muted"></div>

    <hr class="divider">

    <div class="field">
      <label for="ticket">Ticket</label>
      <input id="ticket" type="text" placeholder="SO-83450 or 310821" spellcheck="false">
    </div>

    <hr class="divider">

    <div class="field">
      <label for="network">Network</label>
      <input id="network" type="text" value="gmb" placeholder="gmb" spellcheck="false">
    </div>

    <div class="btn-grid">
      <button id="listings-tools" class="secondary">Listings Tools</button>
      <button id="kick-listings" class="secondary">⚽ Kick Listings</button>
      <button id="super-bo" class="secondary">Super Back Office</button>
      <button id="listing-status" class="secondary" disabled>Listing Status</button>
      <button id="gmb-token-health" class="secondary" disabled>GMB Token Health</button>
      <button id="super-duper-bo" class="secondary">Super Duper BO</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
