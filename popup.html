<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <h2>SOCi URL Helper</h2>

    <div id="not-soci" class="hidden">
      <p class="muted">Not a SOCi page.</p>
      <p class="muted">Build a URL manually:</p>
    </div>

    <div class="field">
      <label for="tenant">Tenant</label>
      <input id="tenant" type="text" value="moz" placeholder="moz or local-app URL" spellcheck="false">
    </div>

    <div class="field-row">
      <div class="field">
        <label for="account">Account ID</label>
        <input id="account" type="text" placeholder="e.g. 3596" spellcheck="false">
      </div>

      <div class="field">
        <label for="project">Project ID</label>
        <input id="project" type="text" placeholder="optional" spellcheck="false">
      </div>
    </div>

    <button id="go">Go</button>

    <div id="preview" class="preview muted"></div>

    <hr class="divider">

    <div class="field">
      <label>Credentials</label>
      <div class="btn-grid">
        <button id="copy-phpsessid" class="secondary" disabled>Copy PHPSESSID</button>
        <button id="copy-request-token" class="secondary" disabled>Copy request_token</button>
      </div>
      <div id="creds-status" class="preview muted"></div>
    </div>

    <hr class="divider">

    <div class="field">
      <label for="ticket">Ticket</label>
      <input id="ticket" type="text" placeholder="SO-83450 or 310821" spellcheck="false">
    </div>

    <hr class="divider">

    <div class="field">
      <label for="network">Network</label>
      <input id="network" type="text" value="gmb" placeholder="gmb" list="network-options" spellcheck="false" autocomplete="off">
      <datalist id="network-options"></datalist>
    </div>

    <div class="btn-grid">
      <button id="listings-tools" class="secondary">Listings Tools</button>
      <button id="kick-listings" class="secondary">⚽ Kick Listings</button>
      <button id="kick-listings-legacy" class="secondary" disabled>Kick Listings (Legacy)</button>
      <button id="super-bo" class="secondary">Super Back Office</button>
      <button id="listing-status" class="secondary" disabled>Listing Status</button>
      <button id="listing-images-status" class="secondary" disabled>Image Status</button>
      <button id="gmb-token-health" class="secondary" disabled>GMB Token Health</button>
      <button id="super-duper-bo" class="secondary">Super Duper BO</button>
      <button id="publish-projects" class="secondary">Publish Projects</button>
      <button id="por-network-status" class="secondary" disabled>POR Status</button>
      <button id="localeze-conflicts" class="secondary" disabled>Localeze Conflicts</button>
      <button id="audit-publish" class="secondary danger" disabled>Audit Publish</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
