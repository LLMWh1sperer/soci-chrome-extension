<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <h2>SOCi Support Helper</h2>

    <div class="field">
      <label for="ticket">ZD/Jira Ticket</label>
      <input id="ticket" type="text" placeholder="SO-83450 or 310821" spellcheck="false">
    </div>

    <hr class="divider">

    <div id="not-soci" class="hidden">
      <p class="muted">Not a SOCi page.</p>
      <p class="muted">Build a URL manually:</p>
    </div>

    <div class="field">
      <label for="tenant">Tenant</label>
      <input id="tenant" type="text" value="moz" placeholder="moz or local-app URL" spellcheck="false">
    </div>

    <div class="field-row">
      <div class="field">
        <label for="account">Account ID</label>
        <input id="account" type="text" placeholder="e.g. 3596" spellcheck="false">
      </div>

      <div class="field">
        <label for="project">Project ID</label>
        <input id="project" type="text" placeholder="optional" spellcheck="false">
      </div>
    </div>

    <button id="go">Go</button>

    <div id="preview" class="preview muted"></div>

    <hr class="divider">

    <div class="field">
      <label for="network">Network</label>
      <input id="network" type="text" value="gmb" placeholder="gmb" list="network-options" spellcheck="false" autocomplete="off">
      <datalist id="network-options"></datalist>
    </div>

    <div class="btn-grid">
      <button id="listings-tools" class="secondary">🧰 Listings Tools</button>
      <button id="kick-listings" class="secondary">⚽ Search Projects by Network</button>
      <button id="kick-listings-legacy" class="secondary" disabled>🚀 Kick Listings Publishing</button>
      <button id="apple-api-get" class="secondary">🍎 Apple Maps API Get</button>
      <button id="listing-status" class="secondary" disabled>📊 Listing Status</button>
    </div>

    <hr class="divider">

    <div class="field">
      <label>Credentials</label>
      <div class="btn-grid">
        <button id="copy-phpsessid" class="secondary" disabled>Copy PHPSESSID</button>
        <button id="copy-request-token" class="secondary" disabled>Copy request_token</button>
      </div>
      <div id="creds-status" class="preview muted"></div>
      <button id="copy-zendesk-cookie" class="secondary" disabled>🍪 Copy Zendesk cookie</button>
      <div id="zendesk-cookie-status" class="preview muted"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
